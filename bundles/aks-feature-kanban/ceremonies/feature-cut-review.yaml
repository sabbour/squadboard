name: Feature Cut Review
steps:
  - type: agent_run
    label: PM presents feature scope and acceptance criteria
    agent: aks-pm
    prompt: |
      Prepare and present the feature cut review for all features currently in Validation:
      1. State the feature name, customer problem, and success metric.
      2. List the acceptance criteria (all must be ✅ or ✋ with justification).
      3. State any known gaps or deferred items (with issue links).
      4. Confirm the disclosure draft is ready for review.
      Output: a structured feature cut document for each feature in Validation.
    timeout: 30m

  - type: agent_run
    label: Platform engineer reviews implementation completeness
    agent: aks-platform-engineer
    prompt: |
      For each feature in Validation:
      1. Confirm all ARM API changes are versioned and backward-compatible.
      2. Confirm all `az aks` CLI changes are documented and tested.
      3. List any technical debt introduced (with linked follow-up issues).
      4. State your ship/hold recommendation with rationale.
      Output: per-feature implementation assessment (ship / hold + reason).
    timeout: 30m

  - type: agent_run
    label: Quality engineer presents test results
    agent: aks-quality-engineer
    prompt: |
      For each feature in Validation:
      1. Present the test result summary: test suite, pass/fail counts, k8s versions tested.
      2. List any open P0/P1 bugs. If any exist, this feature cannot move to Done.
      3. Confirm the regression test suite is committed and passing in CI.
      4. State your sign-off: ✅ approved to ship / ❌ blocked by [issue].
      Output: per-feature quality sign-off with test evidence.
    timeout: 30m

  - type: approve
    label: Human approval gate — ship decision
    approvers: []
    timeout: 24h
    timeoutAction: notify

  - type: agent_run
    label: Move approved features to Done and trigger docs
    agent: aks-pm
    prompt: |
      For each feature that received a ship sign-off:
      1. Move the issue to the Done column.
      2. Add the `shipped` label.
      3. Create a new issue in Backlog for aks-docs-engineer: "Publish docs for [feature name]" with the feature cut document attached.
      Output: list of shipped features and the docs issues created.
    timeout: 15m
