name: Customer Signals Digest
steps:
  - type: agent_run
    label: Gather customer signals from all sources
    agent: aks-pm
    prompt: |
      Aggregate customer signals from the past 7 days using the `aks-customer-signal-collection` skill.
      Sources to check (in priority order):
      1. GitHub: github.com/Azure/AKS — new issues labelled `customer-reported` or `question`, new Discussions.
      2. Microsoft Q&A: questions tagged `azure-kubernetes-service` from the past 7 days.
      3. Stack Overflow: questions tagged `azure-aks` with score ≥ 2 or ≥ 3 answers.
      4. Azure Feedback (UserVoice): new items in the AKS category with ≥ 10 votes.
      5. Internal: any support escalation summaries shared in this project's inbox.

      For each signal:
      - Assign a topic (e.g., "node pool upgrade", "networking", "workload identity").
      - Note frequency: how many distinct customers reported this?
      - Map to an existing backlog issue (if one exists) or flag as a potential new issue.

      Output: a structured digest with ≤ 10 top signals, ranked by customer impact.
    timeout: 45m

  - type: agent_run
    label: Deduplicate and prioritise signals
    agent: aks-pm
    prompt: |
      Review the signal digest from the previous step.
      1. Merge duplicate signals (same root cause, different reporters).
      2. For signals not already in the backlog, create a new Backlog issue with:
         - Title: [SIGNAL] <concise description>
         - Body: customer quotes (anonymised), frequency count, source links.
         - Labels: appropriate AKS area label + `customer-signal`.
         - Column: Backlog.
      3. For signals already in the backlog, add a comment with the new frequency data.
      4. Update the weekly signal count metric in the project's team summary card.

      Output: list of new issues created, list of existing issues updated.
    timeout: 20m
