apiVersion: squad.io/v1
kind: Ceremony
metadata:
  name: editorial-review
  displayName: Editorial Review
  description: Run after each draft is written to ensure quality, tone, and SEO alignment before publishing
spec:
  trigger:
    type: agent-signal
    signalName: after-draft
  steps:
    - id: review-draft
      kind: agent-task
      agentName: editor
      prompt: |
        Review the most recently completed draft. Check for tone consistency,
        clarity, SEO keyword usage, and structural completeness. Flag any
        sections that need revision before the post is ready to publish.
