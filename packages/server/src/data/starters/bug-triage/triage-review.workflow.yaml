apiVersion: squad.io/v1
kind: Ceremony
metadata:
  name: triage-review
  displayName: Triage Review
  description: Run after each batch of triage to spot-check the routing decisions
spec:
  trigger:
    type: agent-signal
    signalName: after-batch
  steps:
    - id: review-batch
      kind: agent-task
      agentName: issue-classifier
      prompt: |
        Review the last batch of triaged issues. Flag any obvious mis-routes,
        incorrect severity assignments, or issues that need escalation.
