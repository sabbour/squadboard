apiVersion: squad.io/v1
kind: Ceremony
metadata:
  name: sprint-planning
  displayName: Sprint Planning
  description: Pick the next sprint objective, candidate work, owners, risks, and explicit non-goals.
spec:
  trigger:
    type: manual
  steps:
    - id: collect-candidate-work
      kind: agent-task
      label: Collect candidate work
      agent: "@lead"
      prompt: "Review the project goal, backlog, recent decisions, open risks, and current Ready column. Summarize the candidate work that should be considered for the next sprint."
      timeout: 45m
    - id: specialist-capacity-check
      kind: fan_out
      label: Specialist capacity check
      split_by: agents
      agents:
        - "@backend"
        - "@frontend"
        - "@tester"
      mode: parallel
      merge_strategy: all
      steps:
        - id: capacity-input
          kind: agent-task
          label: Capacity input
          prompt: "Given the candidate work, flag any dependencies, risks, or blockers in your area. Suggest which cards you can own this sprint and flag anything that should stay out of scope."
          timeout: 30m
    - id: draft-sprint-plan
      kind: agent-task
      label: Draft sprint plan
      agent: "@lead"
      prompt: "Synthesize the specialist capacity inputs and candidate work into a sprint plan with an objective, selected cards, assigned owners, risks, dependencies, and what should stay out of scope."
      timeout: 45m
    - id: commit-plan
      kind: approve
      label: Commit the plan
      approvers:
        - "@lead"
      request_changes_policy: first
      timeout: 24h
      timeoutAction: notify
